aid: hummingbird-regtech
name: Hummingbird RegTech
description: >-
  Hummingbird RegTech, Inc. is a financial-crime compliance (RegTech) platform that unifies
  risk and compliance operations for banks, fintechs, and financial institutions. The product
  spans customer screening (sanctions, PEP, and adverse-media), transaction monitoring,
  case management and investigations, and automated regulatory reporting (SAR/STR/CTR filing),
  layered with AI agents and no-code automations plus 60+ pre-built app integrations to data
  warehouses, CRMs, and third-party screening providers. Hummingbird exposes a login-gated
  Hummingbird API for programmatically creating and managing investigations, cases, and
  compliance workflow data. This profile was surfaced as a portfolio company of Battery
  Ventures and enriched from Hummingbird's public web surface by the API Evangelist pipeline.
